# Nginx Server block configuration for Urban Office

server {
    listen 80;
    listen [::]:80;
    server_name urbanoffice.co.id www.urbanoffice.co.id;
    root /var/www/urbanoffice/public_html;
    index index.php index.html;

    # Gzip Compression configurations
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security Headers configuration
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com;" always;

    # Prevent direct PHP execution in uploads directory
    location ~* ^/uploads/.*\.php$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Static Assets Cache-Control headers (1 year max age)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|webp|woff2?|eot|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
        log_not_found off;
    }

    # Main Entry routing
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Pass PHP scripts to FastCGI server (PHP-FPM)
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock; # Adjust based on FPM socket location
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Clean URL Rewrites for dynamic SEO
    # Dynamic sitemap routing
    rewrite ^/sitemap\.xml$ /sitemap.php last;

    # Dynamic blog archives clean URL mapping
    rewrite ^/blog/([a-zA-Z0-9\-]+)/?$ /blog/article.php?slug=$1 last;
    rewrite ^/category/([a-zA-Z0-9\-]+)/?$ /blog/category.php?slug=$1 last;
    rewrite ^/tag/([a-zA-Z0-9\-]+)/?$ /blog/tag.php?slug=$1 last;

    # Dynamic location detail clean URL mapping
    rewrite ^/lokasi-urban-office/([a-zA-Z0-9\-]+)/?$ /lokasi-urban-office/detail.php?slug=$1 last;

    # Clean URL routing for static landing page subdirectories
    location ~ ^/([a-zA-Z0-9\-]+)$ {
        try_files $uri /$1/index.php?$args;
    }
}
